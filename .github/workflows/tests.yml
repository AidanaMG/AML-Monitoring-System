name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/Aml.Domain/Aml.slnx
      - run: dotnet build src/Aml.Domain/Aml.slnx --no-restore
      - run: dotnet test src/Aml.Domain/Aml.slnx --no-build --verbosity normal
